org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
# Single source of truth for the agent version. Feeds the jpackage app-image, the installer zip
# name, and (via the buildConfig plugin) the generated uz.disastrouspumpkin.wdb.agent.BuildConfig.AGENT_VERSION.
wdbAgentVersion=0.2.17
# Version for the plugin/cli/mcp (and the internal libs). The agent versions independently
# (wdbAgentVersion above) because it self-updates far more often. CI overrides this from the
# release tag (-PwdbVersion=<tag>); the value here is the dev default.
wdbVersion=0.1.2

# JBR (JetBrains Runtime 21, windows-x64) pin for the "web" agent installer, which downloads the
# runtime at install time instead of bundling it. Leave blank to skip building the web installer.
# Get a known-good pin from https://github.com/JetBrains/JetBrainsRuntime/releases (a jbr_jcef or
# jbrsdk-less "jbr-21.0.x-windows-x64-b*.tar.gz" asset), then:
#   Invoke-WebRequest <url> -OutFile jbr.tgz; (Get-FileHash jbr.tgz -Algorithm SHA256).Hash
wdbJbrUrl=
wdbJbrSha256=

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
