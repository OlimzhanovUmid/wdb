name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # Windows integration (Task Scheduler, firewall, Job Object, versioned swap,
    # graceful stop) can only be exercised on Windows — design D22.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and test
        run: ./gradlew build --console=plain --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
